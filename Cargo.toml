[package]
name = "modwire"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "x11", "wayland"] }
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "jpeg", "gif"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart", "json", "rustls"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[package.metadata.packager]
product-name = "Modwire"
identifier = "dev.modwire.app"
icons = ["assets/icon.png"]
