name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:/mp-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Тег збігається з версією в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" = "${{ github.ref_name }}"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modwire-windows
          path: C:/mp-target/release/modwire.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p "Modwire.app/Contents/MacOS" "Modwire.app/Contents/Resources"
          lipo -create -output "Modwire.app/Contents/MacOS/modwire" \
            target/aarch64-apple-darwin/release/modwire target/x86_64-apple-darwin/release/modwire
          # .icns з PNG
          mkdir icon.iconset
          for s in 16 32 128 256; do sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png; sips -z $((s*2)) $((s*2)) assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png; done
          iconutil -c icns icon.iconset -o "Modwire.app/Contents/Resources/icon.icns"
          cat > "Modwire.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Modwire</string>
            <key>CFBundleExecutable</key><string>modwire</string>
            <key>CFBundleIdentifier</key><string>dev.modwire.app</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed -i '' "s|<string>0.1.0</string>|<string>$V</string>|" "Modwire.app/Contents/Info.plist"
          codesign --force --deep -s - "Modwire.app"
          hdiutil create -volname "Modwire" -srcfolder "Modwire.app" -ov -format UDZO Modwire.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modwire-macos
          path: Modwire.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Контрольні суми SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
